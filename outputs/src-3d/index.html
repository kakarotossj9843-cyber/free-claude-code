<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720;
const canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x140a2a, 25, 170);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);
scene.add(camera);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.55, 0.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- sky dome (gradient, colours driven per scene) ----------
const skyU = { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() } };
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: skyU, fog: false,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bot; varying vec3 vP;
      void main(){ float h = clamp(normalize(vP).y * 0.5 + 0.5, 0.0, 1.0);
      gl_FragColor = vec4(mix(bot, top, pow(h, 0.7)), 1.0); }`
  })
);
scene.add(sky);

// ---------- toon materials + ink outlines ----------
const gradTex = new THREE.DataTexture(new Uint8Array([70, 150, 255]), 3, 1, THREE.RedFormat);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter;
gradTex.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: gradTex, ...extra });
const INK = new THREE.MeshBasicMaterial({ color: 0x07040f, side: THREE.BackSide });
const heroMat = toon(0x1a1229);
const capeMat = toon(0x2a1436, { side: THREE.DoubleSide });
const bladeMat = new THREE.MeshStandardMaterial({ color: 0xdfe9ff, emissive: 0x66ccff, emissiveIntensity: 1.6, metalness: 0.8, roughness: 0.2 });

function part(geom, mat = heroMat, outline = true) {
  const m = new THREE.Mesh(geom, mat);
  if (outline) {
    const o = new THREE.Mesh(geom, INK);
    o.scale.setScalar(1.06);
    m.add(o);
  }
  return m;
}

// ---------- low-poly anime swordsman ----------
function makeHero(color = 0x1a1229) {
  const mat = color === 0x1a1229 ? heroMat : toon(color);
  const root = new THREE.Group();
  const hips = new THREE.Group(); hips.position.y = 0.95; root.add(hips);
  const legL = new THREE.Group(); legL.position.set(-0.12, 0, 0); hips.add(legL);
  const legR = new THREE.Group(); legR.position.set(0.12, 0, 0); hips.add(legR);
  const legGeo = new THREE.CapsuleGeometry(0.11, 0.7, 4, 8);
  const lLm = part(legGeo, mat); lLm.position.y = -0.5; legL.add(lLm);
  const rLm = part(legGeo, mat); rLm.position.y = -0.5; legR.add(rLm);
  const torso = new THREE.Group(); torso.position.y = 0.1; hips.add(torso);
  const tm = part(new THREE.CapsuleGeometry(0.22, 0.55, 4, 10), mat);
  tm.position.y = 0.45; tm.scale.set(1.1, 1, 0.8); torso.add(tm);
  const sash = part(new THREE.BoxGeometry(0.5, 0.1, 0.4), toon(0xc0283a));
  sash.position.y = 0.12; torso.add(sash);
  const head = part(new THREE.SphereGeometry(0.19, 16, 12), mat);
  head.position.set(0, 1.25, 0); hips.add(head);
  const hair = part(new THREE.ConeGeometry(0.22, 1.0, 8), mat);
  hair.position.set(0, 1.2, -0.22); hair.rotation.x = -1.25; hips.add(hair);
  const cape = part(new THREE.PlaneGeometry(0.55, 1.4), capeMat, false);
  cape.position.set(0, 0.55, -0.2); cape.rotation.x = 0.08; hips.add(cape);
  // sword arm (right)
  const armR = new THREE.Group(); armR.position.set(0.3, 1.0, 0); hips.add(armR);
  armR.add(part(new THREE.CapsuleGeometry(0.07, 0.5, 4, 6), mat).translateY(-0.3));
  const blade = new THREE.Group(); blade.position.y = -0.62; armR.add(blade);
  const hilt = part(new THREE.BoxGeometry(0.05, 0.25, 0.05), toon(0x2b1a10)); hilt.position.y = 0; blade.add(hilt);
  const bl = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.1, 0.012), bladeMat); bl.position.y = -0.65; blade.add(bl);
  // off arm (left)
  const armL = new THREE.Group(); armL.position.set(-0.3, 1.0, 0); hips.add(armL);
  armL.add(part(new THREE.CapsuleGeometry(0.07, 0.5, 4, 6), mat).translateY(-0.3));
  return { root, hips, legL, legR, torso, head, hair, cape, armR, blade, armL };
}

// pose: r = raise of sword arm (0 = down, PI = overhead), walk phase, sway
function pose(h, { r = 0.3, walk = 0, sway = 0, lean = 0 }) {
  h.legL.rotation.x = Math.sin(walk) * 0.5;
  h.legR.rotation.x = -Math.sin(walk) * 0.5;
  h.torso.rotation.z = lean;
  h.armR.rotation.z = -r;
  h.armL.rotation.z = 0.25 + Math.sin(walk) * 0.15;
  h.cape.rotation.z = sway * 0.35;
  h.cape.rotation.x = 0.08 + Math.abs(sway) * 0.15;
  h.hair.rotation.z = sway * 0.2;
}

// ---------- groups per scene ----------
const G = [0, 1, 2, 3, 4, 5].map(() => { const g = new THREE.Group(); scene.add(g); return g; });
const LIGHT_SUN = new THREE.DirectionalLight(0xffd6b0, 1.6);
LIGHT_SUN.position.set(6, 10, 4);
const AMB = new THREE.AmbientLight(0x6a6fb0, 0.7);
scene.add(AMB, LIGHT_SUN);

// ---------- scene 1: neo city night ----------
let seed = 42;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const winCanvas = document.createElement('canvas'); winCanvas.width = 256; winCanvas.height = 512;
{
  const c = winCanvas.getContext('2d');
  c.fillStyle = '#15102a'; c.fillRect(0, 0, 256, 512);
  for (let y = 10; y < 512; y += 22) for (let x = 10; x < 256; x += 20) {
    const lit = rnd() < 0.45;
    c.fillStyle = lit ? (rnd() < 0.5 ? '#ffc878' : '#7fe8ff') : '#241c40';
    c.fillRect(x, y, 10, 13);
  }
}
const winTex = new THREE.CanvasTexture(winCanvas);
winTex.colorSpace = THREE.SRGBColorSpace;
const bldMat = new THREE.MeshStandardMaterial({ map: winTex, emissiveMap: winTex, emissive: 0xffffff, emissiveIntensity: 1.3, roughness: 0.8 });
const bldGeo = new THREE.BoxGeometry(1, 1, 1);
for (let z = -200; z < 10; z += 7) {
  for (const side of [-1, 1]) {
    const w = 6 + rnd() * 8, d = 6 + rnd() * 5, h = 10 + rnd() * 45;
    const b = new THREE.Mesh(bldGeo, bldMat);
    b.scale.set(w, h, d);
    b.position.set(side * (13 + rnd() * 10), h / 2, z);
    G[0].add(b);
  }
}
const street = new THREE.Mesh(new THREE.PlaneGeometry(40, 400),
  new THREE.MeshStandardMaterial({ color: 0x262050, roughness: 0.2, metalness: 0.3 }));
street.rotation.x = -Math.PI / 2; street.position.set(0, 0, -100); G[0].add(street);
const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.6, 2.4, 2.1) }));
moon.position.set(18, 40, -140); G[0].add(moon);
const RAIN_N = 900;
const rainPos = new Float32Array(RAIN_N * 6);
const rainSeed = Array.from({ length: RAIN_N }, () => [rnd() * 60 - 30, rnd() * 40, rnd() * 220 - 180, 0.6 + rnd() * 0.6]);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9fb0ff, transparent: true, opacity: 0.55 }));
G[0].add(rain);
const rimL = new THREE.DirectionalLight(0x66d9ff, 2.5); rimL.position.set(-2, 5, -12); rimL.target.position.set(0, 2, -6); G[0].add(rimL, rimL.target);
const hero1 = makeHero(); hero1.root.position.set(0, 0, -6); hero1.root.rotation.y = 0.0; G[0].add(hero1.root);

// ---------- scene 2: sunset cliff ----------
const sunMat2 = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.0, 2.2, 1.4) });
const sun2 = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 16), sunMat2); sun2.position.set(0, 16, -120); G[1].add(sun2);
for (const [x, y, z, s] of [[-40, 0, -110, 26], [0, -2, -150, 34], [45, 0, -120, 28], [-14, 0, -70, 12], [22, -1, -90, 16]]) {
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), toon(0x4a2a5e));
  m.scale.set(s, s * 0.7, s * 0.9); m.position.set(x, y + s * 0.35, z); G[1].add(m);
}
const cliff = new THREE.Mesh(new THREE.DodecahedronGeometry(3, 1), toon(0x2a1a3a));
cliff.scale.set(2.8, 1.5, 2.6); cliff.position.set(0, -0.8, -9); G[1].add(cliff);
const ground2 = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), toon(0x1a0f26));
ground2.rotation.x = -Math.PI / 2; ground2.position.y = -2; G[1].add(ground2);
const hero2 = makeHero(); hero2.root.position.set(0, 3.7, -9); G[1].add(hero2.root);

// petals (shared by scenes 2, 5, 6)
const PN = 260;
const petalMat = new THREE.MeshBasicMaterial({ color: 0xffb6d0, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
const petals = new THREE.InstancedMesh(new THREE.CircleGeometry(0.09, 6), petalMat, PN);
const pp = Array.from({ length: PN }, () => ({ x: rnd() * 30 - 15, y: rnd() * 16, z: rnd() * 60 - 50, sp: 0.6 + rnd() * 0.8, ph: rnd() * 6.28 }));
G[1].add(petals); G[4].add(petals.clone()); G[5].add(petals.clone());
const dummy = new THREE.Object3D();
function updatePetals(lt, mesh) {
  for (let i = 0; i < PN; i++) {
    const p = pp[i];
    const y = ((p.y - lt * p.sp) % 16 + 16) % 16;
    dummy.position.set(p.x + Math.sin(lt * 1.3 + p.ph) * 1.2, y, p.z);
    dummy.rotation.set(lt * 1.7 + p.ph, lt * 1.1, lt * 0.9 + p.ph);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}
// petals in scenes 4/5 use their own cloned meshes
const petals5 = G[4].children.find(c => c.isInstancedMesh);
const petals6 = G[5].children.find(c => c.isInstancedMesh);
const petals2 = G[1].children.find(c => c.isInstancedMesh);

// ---------- scene 3: power charge ----------
const orb = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3, 3) }));
orb.position.set(0, 2.2, -6); G[2].add(orb);
const glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 256;
{
  const c = glowCanvas.getContext('2d');
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(120,230,255,0.8)');
  g.addColorStop(0.6, 'rgba(40,120,255,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
glow.position.copy(orb.position); G[2].add(glow);
const SL = 90;
const slPos = new Float32Array(SL * 6);
const slGeo = new THREE.BufferGeometry(); slGeo.setAttribute('position', new THREE.BufferAttribute(slPos, 3));
const speedLines = new THREE.LineSegments(slGeo, new THREE.LineBasicMaterial({ color: 0xc8f0ff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }));
speedLines.position.z = -6; speedLines.position.y = 2.2; G[2].add(speedLines);
const hero3 = makeHero(); hero3.root.position.set(-2.6, 0, -7); hero3.root.rotation.y = 0.3; G[2].add(hero3.root);

// ---------- scene 4: clash ----------
const heroL = makeHero(0x1a0a10), heroR = makeHero(0x0a1030);
heroL.root.rotation.y = Math.PI / 2; heroR.root.rotation.y = -Math.PI / 2;
G[3].add(heroL.root, heroR.root);
const redLight = new THREE.PointLight(0xff3050, 40, 30); redLight.position.set(-4, 3, -6); G[3].add(redLight);
const blueLight = new THREE.PointLight(0x3080ff, 40, 30); blueLight.position.set(4, 3, -6); G[3].add(blueLight);
const slashC = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 18), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.5, 3, 3), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
slashC.position.set(0, 2.2, -9); slashC.rotation.z = 0.7; G[3].add(slashC);
const slashR = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 18), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 0.6, 0.8), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
slashR.position.set(0, 2.0, -9.1); slashR.rotation.z = -0.5; G[3].add(slashR);
const sparkGeo = new THREE.BufferGeometry();
const SP = 80; const spPos = new Float32Array(SP * 3); sparkGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xffe6a0, size: 0.09, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
G[3].add(sparks);
const flash = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.3), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false, depthWrite: false }));
flash.position.set(0, 0, -1); flash.renderOrder = 999; camera.add(flash);

// ---------- scene 5: dawn ----------
const sunMat5 = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 2.1, 1.0) });
const sun5 = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 16), sunMat5); G[4].add(sun5);
const hill5 = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), toon(0x2a1234));
hill5.scale.set(40, 18, 20); hill5.position.set(0, -14, -25); G[4].add(hill5);
const hill5b = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), toon(0x3d1c3e));
hill5b.scale.set(60, 10, 30); hill5b.position.set(-20, -18, -70); G[4].add(hill5b);
const hero5 = makeHero(); hero5.root.position.set(0, 4.0, -25); hero5.root.scale.setScalar(1.3); G[4].add(hero5.root);

// ---------- scene 6: end card ----------
const sunMat6 = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.6, 1.6, 0.8) });
const sun6 = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 16), sunMat6); sun6.position.set(0, 0.2, -40); G[5].add(sun6);
const ground6 = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), toon(0x1a0c16));
ground6.rotation.x = -Math.PI / 2; G[5].add(ground6);
const hero6 = makeHero(); hero6.root.position.set(0, 0, -7); hero6.root.scale.setScalar(1.3); G[5].add(hero6.root);

// ---------- scene settings ----------
const SKY = [
  [0x0a0826, 0x4d1a5e, 0x1a0c30, 25, 170],
  [0x231a50, 0xffa07a, 0x7a3a5a, 30, 180],
  [0x03081f, 0x1a5a8a, 0x0a2040, 20, 150],
  [0x0a0a1a, 0x2a0a18, 0x180818, 15, 120],
  [0x0c1440, 0xffc89a, 0x8a5a6a, 25, 160],
  [0x0a0614, 0x3a1020, 0x2a0c18, 15, 120],
];
const tmpC = new THREE.Color();
function setSky(i) {
  const [top, bot, fog, nr, fr] = SKY[i];
  skyU.top.value.set(top); skyU.bot.value.set(bot);
  scene.fog.color.set(fog); scene.fog.near = nr; scene.fog.far = fr;
}

const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;

function camLook(pos, target, shake = 0, lt = 0) {
  camera.position.set(pos[0] + Math.sin(lt * 61) * shake, pos[1] + Math.cos(lt * 47) * shake, pos[2]);
  camera.lookAt(target[0], target[1], target[2]);
}

function sceneOf(t) {
  if (t < 18) return [0, t];
  if (t < 38) return [1, t - 18];
  if (t < 60) return [2, t - 38];
  if (t < 85) return [3, t - 60];
  if (t < 105) return [4, t - 85];
  return [5, t - 105];
}

function s1(lt) {
  camLook([0.9 + 0.5 * Math.sin(lt * 0.2), 2.3, -1.4 - lt * 0.12], [0, 2.3, -7], 0, lt);
  for (let i = 0; i < RAIN_N; i++) {
    const [x, y0, z, sp] = rainSeed[i];
    const y = ((y0 - lt * 22 * sp) % 40 + 40) % 40;
    const x2 = x - 0.25 * (y - y0 + 1) * 0.02;
    rainPos.set([x, y, z, x - 0.12, y - 1.1 * sp, z], i * 6);
  }
  rainGeo.attributes.position.needsUpdate = true;
  hero1.root.rotation.y = Math.sin(lt * 0.5) * 0.15;
  pose(hero1, { r: 0.4, walk: 0, sway: Math.sin(lt * 2) * 0.6, lean: 0.02 });
  bloom.strength = 0.6;
}

function s2(lt) {
  camLook([0.8 * Math.sin(lt * 0.2) - 0.6, 4.4, -1.6 + lt * 0.03], [0, 4.6, -9], 0, lt);
  updatePetals(lt, petals2);
  pose(hero2, { r: lerp(0.5, 1.9, ease(lt / 18)), walk: 0, sway: Math.sin(lt * 1.5) * 0.7 });
  bloom.strength = 0.7;
}

function s3(lt) {
  const R = lerp(0.05, 1.7, ease(lt / 22));
  orb.scale.setScalar(R);
  glow.scale.setScalar(R * 7);
  const shake = ease(lt / 22) * 0.06;
  camLook([0, 2.2, 0], [0, 2.2, -6], shake, lt);
  for (let k = 0; k < SL; k++) {
    const [a0, ln] = [k * 2 * Math.PI / SL, 0.6 + (k * 37 % 10) / 10];
    const p = ((lt * 2.5 + k * 0.173) % 1);
    const r0 = 0.5 + p * 4.5, r1 = r0 + ln * 0.9;
    const c = Math.cos(a0), s = Math.sin(a0);
    slPos.set([c * r0, s * r0, 0, c * r1, s * r1, 0], k * 6);
  }
  slGeo.attributes.position.needsUpdate = true;
  pose(hero3, { r: 2.5 + Math.sin(lt * 3) * 0.1, walk: 0, sway: Math.sin(lt * 2) * 0.5 });
  bloom.strength = 1.1 + ease(lt / 22) * 0.5;
}

function s4(lt) {
  camLook([0, 2.0, -1.8], [0, 2.1, -9], lt > 12 ? 0.05 : 0, lt);
  const approach = ease(lt / 12);
  const recoil = ease((lt - 12) / 6) * 0.9;
  const xl = lerp(-5, -1.4, approach) - recoil;
  const xr = -xl;
  heroL.root.position.set(xl, 0, -9);
  heroR.root.position.set(xr, 0, -9);
  const swing = lerp(2.1, -0.4, ease((lt - 9) / 3));
  pose(heroL, { r: swing, walk: lt * 4, sway: 0.4 });
  pose(heroR, { r: swing, walk: lt * 4, sway: -0.4 });
  slashC.visible = slashR.visible = lt > 12;
  if (lt > 12) {
    const p = ease((lt - 12) / 0.6);
    slashC.scale.y = p; slashR.scale.y = p;
    slashC.material.opacity = 1 - (lt - 12) / 10;
    slashR.material.opacity = 1 - (lt - 12) / 10;
    for (let i = 0; i < SP; i++) {
      const a = i * 2.399, spd = 2 + (i * 37 % 30) / 10;
      const r = (lt - 12) * spd;
      spPos.set([Math.cos(a) * r, 2.0 + Math.sin(a) * r * 0.6, -9], i * 3);
    }
    sparkGeo.attributes.position.needsUpdate = true;
  }
  flash.material.opacity = lt >= 12 ? Math.max(0, 1 - (lt - 12) / 0.4) * 0.8 : 0;
  redLight.intensity = 40 + (lt > 12 ? 80 * Math.max(0, 1 - (lt - 12) / 1) : 0);
  blueLight.intensity = redLight.intensity;
  bloom.strength = 0.9 + (lt > 12 ? 1.2 * Math.max(0, 1 - (lt - 12) / 1) : 0);
}

function s5(lt) {
  const sy = lerp(-4, 9, ease(lt / 18));
  sun5.position.set(0, sy, -120);
  camLook([0, 3.2, -12 + lt * 0.05], [0, 5.0, -25], 0, lt);
  updatePetals(lt, petals5);
  pose(hero5, { r: 0.6 + Math.sin(lt * 1.1) * 0.2, walk: 0, sway: Math.sin(lt * 1.1) * 0.5 });
  bloom.strength = 0.8;
}

function s6(lt) {
  camLook([Math.sin(lt * 0.15) * 1.5, 2.2, -1.5], [0, 2.1, -7], 0, lt);
  hero6.root.rotation.y = lt * 0.25;
  updatePetals(lt * 0.8, petals6);
  pose(hero6, { r: 0.5, walk: 0, sway: Math.sin(lt * 1.4) * 0.6 });
  bloom.strength = 0.9;
}

const FNS = [s1, s2, s3, s4, s5, s6];
function update(t) {
  const [si, lt] = sceneOf(t);
  G.forEach((g, i) => { g.visible = i === si; });
  setSky(si);
  FNS[si](lt);
  flash.visible = si === 3;
  AMB.intensity = si === 3 ? 0.35 : 0.7;
}

window.renderAt = (t) => {
  update(t);
  composer.render();
  return canvas.toDataURL('image/png');
};
window.ready = true;
</script>
